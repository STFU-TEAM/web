<dl class="figures compact wallet" id="wallet" {% if oob %}hx-swap-oob="true"{% endif %}>
  <div><dt>{{ icon('dust', label=False) }} {{ DUST }}</dt><dd>{{ u.fragments|num }}</dd></div>
  <div><dt>{{ icon('head', label=False) }} {{ HEADS }}</dt><dd>{{ u.super_fragments|num }}</dd></div>
  <div><dt>⚡ Energy</dt><dd>{{ u.energy }}/{{ u.total_energy }}</dd></div>
</dl>
