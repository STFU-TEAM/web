<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance | STFU Requiem</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="60">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/icon-32.png') }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
  <style>
    :root { --night: #1C0F2E; --night-2: #2B1747; --ink: #1C0F2E; --paper: #EDE6F7; --muted: #B3A3CF; --gold: #F4C542; --magenta: #D6246E; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.2rem; background: radial-gradient(circle at 50% 30%, #3A1E5E, var(--night) 70%);
      color: var(--paper); font: 400 1.05rem/1.55 "Zen Kaku Gothic New", "Segoe UI", system-ui, sans-serif; }
    .card { position: relative; max-width: 34rem; width: 100%; padding: 1.6rem 1.5rem 1.4rem; text-align: center; border: 3px solid var(--ink);
      border-radius: 16px; background: var(--night-2); box-shadow: 6px 6px 0 var(--magenta); }
    .mascot { width: 104px; height: 104px; border-radius: 50%; border: 4px solid var(--gold); margin: -4.4rem auto .6rem; display: block; background: var(--night); }
    .kicker { margin: 0; color: var(--gold); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .8rem; }
    h1 { margin: .2rem 0 .6rem; font: 400 clamp(1.8rem, 6vw, 2.6rem)/1.1 "Dela Gothic One", "Arial Black", sans-serif; text-shadow: 3px 3px 0 var(--magenta); }
    .msg { margin: 0 0 .8rem; white-space: pre-line; }
    .until { display: inline-block; margin: 0 0 1rem; padding: .25rem .8rem; border-radius: 999px; border: 2px dashed var(--gold); font-weight: 700; font-size: .9rem; }
    .menace { position: absolute; right: -.4rem; top: -1.4rem; font: 400 1.6rem/1 "Dela Gothic One", sans-serif; color: var(--magenta); writing-mode: vertical-rl;
      text-shadow: 2px 2px 0 var(--ink); animation: shake .5s steps(2) infinite; }
    @keyframes shake { 50% { transform: translate(1px, -1px) rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { .menace { animation: none; } }
    a { color: var(--gold); }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <span class="menace" aria-hidden="true">ゴゴゴ</span>
    <img class="mascot" src="{{ url_for('static', filename='img/mascot-face.webp') }}" alt="" width="104" height="104">
    <p class="kicker">Stand by, Stand user</p>
    <h1>Under maintenance</h1>
    <p class="msg">{{ m.message or "STFU Requiem is getting an update. Your save is safe: come back in a little while." }}</p>
    {% if m.until %}<p class="until">Back around {{ m.until }}</p>{% endif %}
    <p><small>This page checks again every minute. News and updates on the <a href="https://discord.gg/stfurequiem">Discord server</a>.</small></p>
  </main>
</body>
</html>
