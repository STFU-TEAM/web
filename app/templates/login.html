{% extends "base.html" %}
{% block title %}Log in | STFU Requiem{% endblock %}
{% block main %}
<section class="page auth-page">
  <div class="auth-card">
    <p class="kicker">Welcome back</p>
    <h1 class="display sm">Log in</h1>
    {% if config.DISCORD_CLIENT_ID %}
      <a class="btn discord big block" href="{{ url_for('auth.discord_login', next=next) }}">Continue with Discord</a>
      <p class="auth-or"><span>or</span></p>
    {% endif %}
    <form class="auth-form" method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Username<input type="text" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn gold big block">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('auth.register', next=next) }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
