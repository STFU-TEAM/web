{% extends "base.html" %}
{% block title %}Stands | STFU Requiem{% endblock %}
{% block main %}
<section class="page">
  <h1 class="display sm">Every stand</h1>
  <form class="filters" hx-get="{{ url_for('main.stands') }}" hx-target="#grid" hx-trigger="input changed delay:250ms from:input[name=q], change" hx-push-url="true">
    <label class="search">
      <span class="sr">Search stands</span>
      <input type="search" name="q" value="{{ q }}" placeholder="Search by name or ability" autocomplete="off">
    </label>
    <fieldset class="chips">
      <legend class="sr">Rarity</legend>
      <label><input type="radio" name="rarity" value="" {% if not rarity %}checked{% endif %}><span>All</span></label>
      {% for r in rarities %}
        <label><input type="radio" name="rarity" value="{{ r }}" {% if rarity == r %}checked{% endif %}><span>{{ r }}</span></label>
      {% endfor %}
    </fieldset>
    <fieldset class="chips look-chips">
      <legend>Cosmetics</legend>
      {% for key, label in looks.items() %}
        <label title="{{ 'Show each card as a ★' ~ FULLART_STARS ~ ' full art, a shiny, or both' if key else 'The plain card' }}"><input type="radio" name="look" value="{{ key }}" {% if look == key %}checked{% endif %}><span>{{ '✨ ' if 'shiny' in key or key == 'both' }}{{ label }}</span></label>
      {% endfor %}
      <label class="unique-toggle" title="Only stands with a hand-made illustration for this look"><input type="checkbox" name="unique" value="1" {% if unique %}checked{% endif %}><span>🎨 Unique art only</span></label>
    </fieldset>
  </form>
  <div id="grid">{{ grid }}</div>
</section>
{% endblock %}
