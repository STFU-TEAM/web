# Coolify: new resource -> Docker Compose -> this repo.
# Domain https://stfurequiem.com on service "web", port 8000. The "worker" service has no domain: it runs the
# background jobs (puzzle building, daily backups, notifications) so they never slow a page down.
# REDIS_URL MUST be the bot's Redis: it is the game's only database.
x-env: &env
  SECRET_KEY: ${SECRET_KEY}
  REDIS_URL: ${REDIS_URL}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
  DISCORD_ADMIN_IDS: ${DISCORD_ADMIN_IDS:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
  DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://stfurequiem.com/auth/callback}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://images.stfurequiem.com}
  IMAGE_PATH: ${IMAGE_PATH:-/Image/{id}.png}
  ART_PATH: ${ART_PATH:-}
  KOFI_URL: ${KOFI_URL:-https://ko-fi.com/eirblast}
  DUNGEON_ENABLED: ${DUNGEON_ENABLED:-1}
  # daily Redis backups (app/backup.py) land on the backups volume; a Discord webhook gets an off-site copy
  BACKUP_DIR: /data/backups
  BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
  # errors are posted to this Discord webhook as they happen (app/alerts.py)
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  # hashes IP addresses for the alt-account flags (app/alts.py); defaults to SECRET_KEY
  IP_SALT: ${IP_SALT:-}
  # web push: without these the container never sees the keys and push stays off
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@stfurequiem.com}

services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      <<: *env
      RUN_BACKGROUND: "0"   # the worker service runs the background jobs
      WEB_WORKERS: ${WEB_WORKERS:-3}
      WEB_THREADS: ${WEB_THREADS:-8}
    volumes:
      - backups:/data/backups   # the admin Safety tab lists and downloads the worker's backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "scripts/worker.py"]
    environment:
      <<: *env
    volumes:
      - backups:/data/backups
    healthcheck:
      disable: true   # no web server here (the image's own healthcheck curls one)

volumes:
  backups:
